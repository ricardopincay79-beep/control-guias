<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Guías</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f2f4f7;
    }

    h1 {
      color: #1a73e8;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      padding: 15px 25px;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      background: #1a73e8;
      color: white;
    }
  </style>
</head>

<body>

  <h1>📷 ESCÁNER DE GUÍAS</h1>

  <div id="reader"></div>

  <div id="resultado">
    Apunta la cámara al código de barras.
  </div>

  <script>

let lecturaProcesada = false;

function codigoDetectado(codigo) {

  if (lecturaProcesada) return;
  lecturaProcesada = true;

  document.getElementById("resultado").innerText =
    "GUÍA DETECTADA: " + codigo;

  const urlControl =
    "https://script.google.com/macros/s/AKfycbxrw-BbJz_YMkT_pqvenc5xQ07Lb8zmozpZej-fSAmj5XT1-_1fqkjnsprDp9rBQ9-a1A/exec";

  setTimeout(function() {

    window.location.href =
      urlControl + "?guia=" + encodeURIComponent(codigo);

  }, 700);

}

    }

    function errorLectura(error) {
      // Ignorar errores normales mientras busca el código
    }

 const scanner = new Html5Qrcode(
  "reader",
  {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  }
);

scanner.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: {
      width: 300,
      height: 150
    }
  },
  codigoDetectado,
  errorLectura
).catch(function(error) {

  document.getElementById("resultado").innerText =
    "No se pudo abrir la cámara trasera.";

  console.error(error);

});

  </script>

</body>
</html>
